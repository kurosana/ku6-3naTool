<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チームシート作成</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- エントランス画面 -->
    <section id="screen-entrance" class="screen active">
      <div class="app-version-wrap" id="app-version-wrap">
        <span class="app-version" id="app-version"></span>
        <span class="app-version app-release-notes" id="app-release-notes" hidden></span>
      </div>
      <div class="entrance-main">
        <div class="entrance-centered-block">
          <p class="entrance-main-comment" id="entrance-main-comment" hidden></p>
          <div class="entrance-past-row">
            <button type="button" class="btn-past" id="btn-past">過去パーティ呼び出し</button>
          </div>
          <div class="entrance-stack">
            <button type="button" class="btn-load-image" id="btn-load-image">画像を読み込む</button>
            <div class="entrance-secondary-row">
              <button type="button" class="btn-start-without" id="btn-start-without">画像認識なしで開始</button>
              <button type="button" class="btn-start-no-moves" id="btn-start-no-moves">わざなしで開始</button>
            </div>
            <button type="button" class="btn-start-without" id="btn-load-json">jsonを読み込んで開始</button>
          </div>
        </div>
      </div>
      <p class="explanation" id="entrance-explanation"></p>
      <input type="file" id="input-image" accept="image/*" hidden>
    </section>

    <!-- パーティシート設定画面 -->
    <section id="screen-sheet" class="screen">
      <header class="sheet-header">
        <button type="button" class="btn-back" id="btn-back-sheet">戻る</button>
        <div class="sheet-header-actions">
          <button type="button" class="btn-preview" id="btn-preview"><span>プレビュー</span><span>表示</span></button>
          <button type="button" class="btn-output" id="btn-output"><span>画像</span><span>出力</span></button>
        </div>
      </header>
      <div class="sheet-scroll">
        <div class="sheet-form">
          <div class="form-row">
            <label id="label-handle">ハンドルネーム</label>
            <input type="text" id="input-handle" placeholder="ハンドルネーム" maxlength="50">
          </div>
          <div class="form-row">
            <label id="label-trainer">トレーナーネーム</label>
            <input type="text" id="input-trainer" placeholder="トレーナーネーム" maxlength="50">
          </div>
          <div class="form-row">
            <label id="label-friendcode">フレンドコード</label>
            <input type="tel" id="input-friendcode" placeholder="フレンドコード" inputmode="numeric" pattern="[0-9]*" maxlength="12">
          </div>
          <p class="sheet-note" id="sheet-note"></p>
          <div class="eng-output-row">
            <span class="eng-output-label">英語で出力</span>
            <button type="button" class="toggle-switch" id="toggle-eng-output" role="switch" aria-checked="false">
              <span class="toggle-knob"></span>
              <span class="toggle-label-text">OFF</span>
            </button>
          </div>
          <div class="pokemon-slots" id="pokemon-slots">
            <!-- 6スロットは JS で生成 -->
          </div>
          <div class="json-copy-row">
            <button type="button" class="btn-copy-json" id="btn-copy-json">jsonコピー</button>
            <button type="button" class="btn-clear-moves" id="btn-clear-moves">技を全消去</button>
          </div>
          <div class="move-bug-row" id="move-bug-row">
            <span class="move-bug-label">技不具合</span>
            <button type="button" class="toggle-switch toggle-switch--quiet" id="toggle-move-bug" role="switch" aria-checked="false" aria-label="技不具合">
              <span class="toggle-knob"></span>
              <span class="toggle-label-text">OFF</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 過去の画像画面 -->
    <section id="screen-history" class="screen">
      <header class="sheet-header">
        <button type="button" class="btn-back" id="btn-back-history">戻る</button>
      </header>
      <div class="history-list" id="history-list"></div>
    </section>
  </div>

  <!-- プレビューオーバーレイ -->
  <div id="overlay-preview" class="overlay" aria-hidden="true">
    <div class="preview-overlay-backdrop"></div>
    <div class="preview-overlay-box">
      <button type="button" class="btn-close-preview" id="btn-close-preview" aria-label="閉じる">×</button>
      <p class="preview-overlay-note">※画像を取得する場合は「画像出力」を行ってください</p>
      <div id="preview-overlay-content" class="preview-overlay-content"></div>
    </div>
  </div>

  <!-- 画像保存オーバーレイ（iframe内モバイル用） -->
  <div id="overlay-save-image" class="overlay" aria-hidden="true">
    <div class="preview-overlay-backdrop" id="save-image-backdrop"></div>
    <div class="preview-overlay-box">
      <button type="button" class="btn-close-preview" id="btn-close-save-image" aria-label="閉じる">×</button>
      <p class="preview-overlay-note">長押し（または2本指タップ）→「写真に追加」で保存できます</p>
      <div class="preview-overlay-content">
        <img id="save-image-img" src="" alt="チームシート" style="display:block;max-width:100%;height:auto;">
      </div>
    </div>
  </div>

  <!-- 処理中オーバーレイ（画像認識など） -->
  <div id="overlay-progress" class="overlay overlay-progress" aria-hidden="true">
    <div class="progress-overlay-backdrop"></div>
    <div class="progress-overlay-box">
      <p class="progress-overlay-hint" id="progress-overlay-hint" aria-hidden="true"></p>
      <p class="progress-overlay-hint progress-overlay-hint2" id="progress-overlay-hint2" aria-hidden="true"></p>
      <p class="progress-overlay-text" id="progress-overlay-text">0% 完了</p>
      <div class="progress-overlay-bar-wrap">
        <div class="progress-overlay-bar-fill" id="progress-overlay-bar"></div>
      </div>
    </div>
  </div>

  <!-- 画像認識デバッグオーバーレイ（debugRecognition: 1 のときのみ表示） -->
  <div id="overlay-debug-recognition" class="overlay overlay-debug" aria-hidden="true">
    <div class="debug-overlay-backdrop"></div>
    <div class="debug-overlay-box">
      <div class="debug-overlay-header">
        <h2>画像認識デバッグ</h2>
        <button type="button" class="btn-close-debug" id="btn-close-debug" aria-label="閉じる">×</button>
      </div>
      <div class="debug-overlay-body">
        <canvas id="debug-canvas-full"></canvas>
        <div class="debug-cells" id="debug-cells"></div>
      </div>
    </div>
  </div>

  <!-- JSON読み込みエラーオーバーレイ -->
  <div id="overlay-json-error" class="overlay overlay-json-error" aria-hidden="true">
    <div class="json-error-backdrop"></div>
    <div class="json-error-box">
      <p class="json-error-title">jsonを読み込めませんでした</p>
      <p class="json-error-message" id="json-error-message">クリップボードに有効なパーティjsonが見つかりません。</p>
      <button type="button" class="btn-json-error-ok" id="btn-json-error-ok">OK</button>
    </div>
  </div>

  <!-- ポケモン検索オーバーレイ -->
  <div id="overlay-search" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="search-header">
        <input type="search" id="search-pokemon" placeholder="ポケモン名で検索" autocomplete="off">
        <button type="button" class="btn-close-overlay" id="btn-close-search">閉じる</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <!-- 全わざ検索オーバーレイ（技不具合トグルON時） -->
  <div id="overlay-move-search" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="search-header">
        <input type="search" id="search-move" placeholder="技名で検索" autocomplete="off">
        <button type="button" class="btn-close-overlay" id="btn-close-move-search">閉じる</button>
      </div>
      <div class="search-results" id="move-search-results"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="debug.js" onerror="void 0"></script>
  <script src="js/data.js"></script>
  <script src="js/recognition.js"></script>
  <script src="js/sheet-render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
