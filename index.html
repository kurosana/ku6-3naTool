<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チームシート作成</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- エントランス画面 -->
    <section id="screen-entrance" class="screen active">
      <button type="button" class="btn-past" id="btn-past">過去の画像</button>
      <div class="entrance-main">
        <button type="button" class="btn-load-image" id="btn-load-image">画像を読み込む</button>
        <button type="button" class="btn-start-without" id="btn-start-without">画像認識なしで開始</button>
      </div>
      <p class="explanation" id="entrance-explanation"></p>
      <input type="file" id="input-image" accept="image/*" hidden>
    </section>

    <!-- パーティシート設定画面 -->
    <section id="screen-sheet" class="screen">
      <header class="sheet-header">
        <button type="button" class="btn-back" id="btn-back-sheet">戻る</button>
        <div class="sheet-header-actions">
          <button type="button" class="btn-preview" id="btn-preview">プレビュー表示</button>
          <button type="button" class="btn-output" id="btn-output">画像を出力</button>
        </div>
      </header>
      <div class="sheet-scroll">
        <div class="sheet-form">
          <div class="form-row">
            <label>ハンドルネーム</label>
            <input type="text" id="input-handle" placeholder="ハンドルネーム" maxlength="50">
          </div>
          <div class="form-row">
            <label>トレーナーネーム</label>
            <input type="text" id="input-trainer" placeholder="トレーナーネーム" maxlength="50">
          </div>
          <div class="form-row">
            <label>フレンドコード</label>
            <input type="tel" id="input-friendcode" placeholder="フレンドコード" inputmode="numeric" pattern="[0-9]*" maxlength="12">
          </div>
          <div class="pokemon-slots" id="pokemon-slots">
            <!-- 6スロットは JS で生成 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 過去の画像画面 -->
    <section id="screen-history" class="screen">
      <header class="sheet-header">
        <button type="button" class="btn-back" id="btn-back-history">戻る</button>
      </header>
      <div class="history-list" id="history-list"></div>
    </section>
  </div>

  <!-- プレビューオーバーレイ -->
  <div id="overlay-preview" class="overlay" aria-hidden="true">
    <div class="preview-overlay-backdrop"></div>
    <div class="preview-overlay-box">
      <button type="button" class="btn-close-preview" id="btn-close-preview" aria-label="閉じる">×</button>
      <div id="preview-overlay-content" class="preview-overlay-content"></div>
    </div>
  </div>

  <!-- 処理中オーバーレイ（画像認識など） -->
  <div id="overlay-progress" class="overlay overlay-progress" aria-hidden="true">
    <div class="progress-overlay-backdrop"></div>
    <div class="progress-overlay-box">
      <p class="progress-overlay-text" id="progress-overlay-text">0% 完了</p>
      <div class="progress-overlay-bar-wrap">
        <div class="progress-overlay-bar-fill" id="progress-overlay-bar"></div>
      </div>
    </div>
  </div>

  <!-- 画像認識デバッグオーバーレイ（debugRecognition: 1 のときのみ表示） -->
  <div id="overlay-debug-recognition" class="overlay overlay-debug" aria-hidden="true">
    <div class="debug-overlay-backdrop"></div>
    <div class="debug-overlay-box">
      <div class="debug-overlay-header">
        <h2>画像認識デバッグ</h2>
        <button type="button" class="btn-close-debug" id="btn-close-debug" aria-label="閉じる">×</button>
      </div>
      <div class="debug-overlay-body">
        <canvas id="debug-canvas-full"></canvas>
        <div class="debug-cells" id="debug-cells"></div>
      </div>
    </div>
  </div>

  <!-- ポケモン検索オーバーレイ -->
  <div id="overlay-search" class="overlay" aria-hidden="true">
    <div class="overlay-inner">
      <div class="search-header">
        <input type="search" id="search-pokemon" placeholder="ポケモン名で検索" autocomplete="off">
        <button type="button" class="btn-close-overlay" id="btn-close-search">閉じる</button>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/recognition.js"></script>
  <script src="js/sheet-render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
